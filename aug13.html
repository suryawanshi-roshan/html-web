<!DOCTYPE html>
<html lang="en">
<head>
        <title>Registration page</title>
</head>
<body>
    <center><h1>User Registration page for job</h1><hr>
        <table border="1" cellpadding="10" cellspacing="0">
               <form action="" method="">
                <tr>
                    <td>Full Name:</td>
                    <td><input type="text" name="name" placeholder="enter your name"></td>
                </tr>
                <tr>
                    <td>Email:</td>
                    <td><input type="email" name="email" placeholder="enter your email"></td>
                </tr>
                <tr>
                    <td>Phone No:</td>
                    <td><input type="tel" name="phone no" placeholder="enter your phone no"></td>
                </tr>
                <tr>
                    <td>Date of Birth</td>
                    <td><input type="date" name="dob"></td>
                </tr>
                <tr>
                    <td>Gender:</td>
                    <td>
                    <input type="radio" name="gender" value="male">Male
                    <input type="radio" name="gender" value="female">female
                    <input type="radio" name="gender" value="other">other
                    </td>
                </tr>
                <tr>
                    <td>Address:</td>
                    <td>
                        <textarea name="address" rows="5" cols="20"></textarea>
                    </td>
                </tr>
                <tr>
                    <td>Qualification:</td>
                    <td>
                        <select name="Qualification">
                            <option>select qualification</option>
                            <option>10th</option>
                            <option>12th</option>
                            <option>Diploma</option>
                            <option>BE / BTech</option>
                            <option>ME / MTech</option>
                            <option>MBA</option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <td>Experience:</td>
                    <td>
                        <input type="radio" name="experience">Fresher
                        <input type="radio" name="experience">Experienced
                    </td>
                </tr>
                <tr>
                    <td>Skills:</td>
                    <td>
                        <input type="checkbox" name="skill">HTML
                        <input type="checkbox" name="skill">CSS
                        <input type="checkbox" name="skill">DA
                        <input type="checkbox" name="skill">python
                     </td>
                </tr>
                <tr>
                    <td>Preferred job:</td>
                    <td>
                        <select name="job">
                            <option>select job</option>
                            <option>Web Developer</option>
                            <option>Software Developer</option>
                            <option>java Developer</option>
                            <option>python Developer</option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <td>Resume:</td>
                    <td><input type="file" name="resume"></td>
                </tr>
                <tr>
                    <td colspan="2" align="center">
                        <input type="submit" value="Register">
                        <input type="reset" value="Reset">
                    </td>
                </tr>
            
    </form>
    </table>

    </center>
</body>
</html>
